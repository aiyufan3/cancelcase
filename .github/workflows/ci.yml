name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-checks:
    name: fixture checks, ${{ matrix.label }} (no credentials, no provider calls)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The version developers use, pinned in .nvmrc.
          - label: Node 22
            id: node22
            node-version-file: .nvmrc
            node-version: ""
          # The next line the engines field allows.
          - label: Node 24
            id: node24
            node-version-file: ""
            node-version: "24"
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_MODE: fixture
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ matrix.node-version-file }}
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Security scan of all tracked files
        run: pnpm security:staged --all
      - name: Production dependency audit (accepted residual list)
        run: pnpm deps:audit
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance (fixture mode)
        run: pnpm exec playwright test
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-output-${{ matrix.id }}
          path: |
            test-results/e2e-output
            playwright-report
          retention-days: 7
